name: Pipeline CI - Sistema de Agendamento 
on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'sistemaDeAgendamento/**'

  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'sistemaDeAgendamento/**'


jobs:
  test-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./sistemaDeAgendamento

    steps:
      - name: Code Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'oracle'
          java-version: 21
          cache: maven


      - name: See Java Version
        run: java --version

      - name: Build Application Package
        run: mvn clean package -DskipTests

